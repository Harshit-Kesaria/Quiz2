<script>
(() => {
  // ---- CONFIG ----
  const QUIZ_SECONDS = 45;
  const POINTS_PER_CORRECT = 100;
  const TIME_BONUS_PER_SEC = 5;
  const LEADERBOARD_KEY = "timeQuizLeaderboard_v1";
  // One-submission-per-browser lock (can be bypassed by clearing site data/incognito)
  const SUBMISSION_LOCK_KEY = "timeQuizSubmissionLocked_v1";

  // Power Automate HTTP trigger URL
  const FLOW_URL =
    "https://default5e60f7a7d4104d38b87593ca12adc3.0e.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/899b9a3c914541c0af2719bf77613032/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=orFxomxolOpdOCpoEiZ4V-xVhRuhx8oNCAcIWGHFjCs";

  const QUESTIONS = [
    {
      q: "You send: “Gentle Reminder”. What does it ACTUALLY mean?",
      choices: ["No pressure", "Please respond soon", "I am annoyed now", "Final warning before escalation"],
      answerIndex: 2
    },
    {
      q: "What is the REAL meaning of: “Let’s circle back later”",
      choices: ["Important discussion pending", "Need more data", "We forgot the solution", "This conversation is ending now"],
      answerIndex: 3
    },
    {
      q: "Which number comes next? 2 → 6 → 12 → 20 → ?",
      choices: ["28", "30", "32", "42"],
      answerIndex: 1
    },
    {
      q: "You have: 1 match, 1 candle, 1 lamp. What do you light first?",
      choices: ["Candle", "Lamp", "Match", "Switch"],
      answerIndex: 2
    },
    {
      q: "Which sound instantly gives “childhood computer lab” energy?",
      choices: ["Dial-up internet tone", "64GB pendrive", "Compass box with calculator", "Fast internet at home"],
      answerIndex: 1
    }
  ];

  // ---- STATE ----
  let timeLeft = QUIZ_SECONDS;
  let timerId = null;
  let current = 0;
  let correct = 0;
  let finished = false;

  // ---- ELEMENTS ----
  const qIndexEl = document.getElementById("qIndex");
  const qTotalEl = document.getElementById("qTotal");
  const correctCountEl = document.getElementById("correctCount");
  const timeLeftEl = document.getElementById("timeLeft");
  const scoreEl = document.getElementById("score");
  const quizArea = document.getElementById("quizArea");
  const progressBar = document.getElementById("progressBar");
  const finishArea = document.getElementById("finishArea");
  const finalSummary = document.getElementById("finalSummary");
  const nameInput = document.getElementById("nameInput");
  const saveBtn = document.getElementById("saveBtn");
  const lockHint = document.getElementById("lockHint");
  const lbBody = document.getElementById("lbBody");
  const exportBtn = document.getElementById("exportBtn");

  // ---- HELPERS ----
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  function computeScore({ correctCount, timeRemaining }) {
    return (correctCount * POINTS_PER_CORRECT) + (timeRemaining * TIME_BONUS_PER_SEC);
  }

  function elapsedSeconds() {
    return QUIZ_SECONDS - timeLeft;
  }

  function hasSubmitted() {
    return localStorage.getItem(SUBMISSION_LOCK_KEY) === "1";
  }

  function applySubmissionLockUI() {
    lockHint.textContent = "Submission limit: you can submit only once on this device/browser.";
    if (hasSubmitted()) {
      saveBtn.disabled = true;
      nameInput.disabled = true;
      saveBtn.textContent = "Already submitted";
    }
  }

  function renderHeader() {
    qTotalEl.textContent = QUESTIONS.length;
    qIndexEl.textContent = finished ? QUESTIONS.length : (current + 1);
    correctCountEl.textContent = correct;
    timeLeftEl.textContent = String(timeLeft).padStart(2, "0");
    timeLeftEl.classList.toggle("danger", timeLeft <= 10 && !finished);
    scoreEl.textContent = computeScore({ correctCount: correct, timeRemaining: timeLeft });

    const pct = clamp((current / QUESTIONS.length) * 100, 0, 100);
    progressBar.style.width = pct + "%";
  }

  function startTimer() {
    stopTimer();
    timerId = setInterval(() => {
      if (finished) return;
      timeLeft = Math.max(0, timeLeft - 1);
      renderHeader();
      if (timeLeft === 0) finishQuiz("Time's up!");
    }, 1000);
  }

  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function renderQuestion() {
    if (finished) return;
    const item = QUESTIONS[current];
    quizArea.innerHTML = `
      <h2>${escapeHtml(item.q)}</h2>
      <p>Pick one answer. Faster completion yields a higher score.</p>
      <div class="answers">
        ${item.choices.map((c, i) => `
          <button class="answer" data-idx="${i}" type="button">
            ${escapeHtml(c)}
          </button>
        `).join("")}
      </div>
    `;
    quizArea.querySelectorAll(".answer").forEach(btn => {
      btn.addEventListener("click", () => handleAnswer(Number(btn.dataset.idx)));
    });
  }

  function handleAnswer(choiceIdx) {
    if (finished) return;
    const item = QUESTIONS[current];
    const buttons = [...quizArea.querySelectorAll(".answer")];
    buttons.forEach(b => b.disabled = true);

    const correctIdx = item.answerIndex;
    const isCorrect = choiceIdx === correctIdx;
    if (isCorrect) correct++;

    buttons.forEach((b, idx) => {
      if (idx === correctIdx) b.classList.add("correct");
      if (idx === choiceIdx && !isCorrect) b.classList.add("wrong");
    });

    renderHeader();

    setTimeout(() => {
      current++;
      if (current >= QUESTIONS.length) finishQuiz("Completed!");
      else { renderHeader(); renderQuestion(); }
    }, 450);
  }

  function finishQuiz(reason) {
    if (finished) return;
    finished = true;
    stopTimer();
    renderHeader();
    progressBar.style.width = "100%";

    quizArea.innerHTML = `
      <h2>${escapeHtml(reason)}</h2>
      <p>Your result is ready. Save it to the leaderboard.</p>
    `;

    finishArea.style.display = "block";
    const finalScore = computeScore({ correctCount: correct, timeRemaining: timeLeft });
    finalSummary.textContent =
      `Score: ${finalScore} • Correct: ${correct}/${QUESTIONS.length} • Time used: ${elapsedSeconds()}s`;

    applySubmissionLockUI();
    if (!hasSubmitted()) nameInput.focus();
  }

  function loadLeaderboard() {
    try {
      const raw = localStorage.getItem(LEADERBOARD_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function saveLeaderboard(entries) {
    localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(entries));
  }

  function renderLeaderboard() {
    const entries = loadLeaderboard();
    entries.sort((a,b) =>
      (b.score - a.score) ||
      (b.correct - a.correct) ||
      (a.time - b.time)
    );

    lbBody.innerHTML = entries.length ? entries.map(e => `
      <tr>
        <td>${escapeHtml(e.name)}</td>
        <td class="mono">${e.score}</td>
        <td class="mono">${e.correct}</td>
        <td class="mono">${e.time}</td>
      </tr>
    `).join("") : `
      <tr><td colspan="4" style="color:var(--muted)">No scores yet.</td></tr>
    `;
  }

  // NEW: send the entry to Power Automate
  async function postToFlow(entry) {
    // Send fields that are typically useful for Excel
    // IMPORTANT: these keys must match the JSON schema in your trigger / mapping in the flow
    const payload = {
      name: entry.name,
      score: entry.score,
      correct: entry.correct,
      time: entry.time,
      ts: entry.ts,
      quiz: "Syensqo Weekly Quiz"
    };

    const res = await fetch(FLOW_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const text = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status} ${res.statusText} ${text}`.trim());
    }
    return res;
  }

  // UPDATED: now also posts to Power Automate
  async function addToLeaderboard(name) {
    if (hasSubmitted()) {
      alert("You have already submitted your score on this device/browser.");
      return;
    }

    const trimmed = name.trim();
    if (!trimmed) return alert("Please enter a name.");

    const score = computeScore({ correctCount: correct, timeRemaining: timeLeft });
    const entry = { name: trimmed, score, correct, time: elapsedSeconds(), ts: Date.now() };

    // UI: prevent double clicks
    saveBtn.disabled = true;
    nameInput.disabled = true;
    const oldText = saveBtn.textContent;
    saveBtn.textContent = "Saving...";

    try {
      // 1) local save (existing behavior)
      const entries = loadLeaderboard();
      entries.push(entry);
      saveLeaderboard(entries);
      renderLeaderboard();

      // 2) remote save (Power Automate -> Excel)
      await postToFlow(entry);

      localStorage.setItem(SUBMISSION_LOCK_KEY, "1");
      saveBtn.textContent = "Saved";
      applySubmissionLockUI();
    } catch (err) {
      console.error(err);
      // Roll back local lock so they can retry
      saveBtn.disabled = false;
      nameInput.disabled = false;
      saveBtn.textContent = oldText;

      alert("Could not save to the online leaderboard (Power Automate). " +
            "Please try again, and check the browser console for details.");
    }
  }

  function resetQuiz() {
    stopTimer();
    timeLeft = QUIZ_SECONDS;
    current = 0;
    correct = 0;
    finished = false;

    finishArea.style.display = "none";
    nameInput.value = "";
    nameInput.disabled = false;
    saveBtn.disabled = false;
    saveBtn.textContent = "Save score";
    lockHint.textContent = "";

    renderHeader();
    renderQuestion();
    startTimer();
  }

  function exportLeaderboardToCSV() {
    let data = [];
    try {
      data = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || "[]");
    } catch {}

    if (!Array.isArray(data) || data.length === 0) {
      alert("No leaderboard data found.");
      return;
    }

    data.sort((a,b) =>
      (b.score - a.score) ||
      (b.correct - a.correct) ||
      (a.time - b.time)
    );

    const header = ["Name","Score","Correct","Time(s)","Timestamp"];
    const rows = data.map(e => [
      e.name ?? "",
      e.score ?? "",
      e.correct ?? "",
      e.time ?? "",
      e.ts ? new Date(e.ts).toISOString() : ""
    ]);

    const csv = [
      header.join(","),
      ...rows.map(r => r.map(val => `"${String(val).replaceAll('"','""')}"`).join(","))
    ].join("\n");

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "leaderboard.csv";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 0);
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // ---- EVENTS ----
  saveBtn.addEventListener("click", () => addToLeaderboard(nameInput.value));
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addToLeaderboard(nameInput.value);
  });
  exportBtn.addEventListener("click", exportLeaderboardToCSV);

  // ---- INIT ----
  renderLeaderboard();
  resetQuiz();
})();
</script>
